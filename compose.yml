services:
  cpp-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp-dev-container
    volumes:
      # ホストのworkspaceディレクトリをコンテナの/workspaceにマウント
      - ./workspace:/workspace
      # ccache のキャッシュを永続化
      - ccache-data:/var/cache/ccache
    # コンテナを起動し続けるための設定
    tty: true
    stdin_open: true

volumes:
  ccache-data:
