services:
  cpp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-${http_proxy:-}}
        - HTTPS_PROXY=${HTTPS_PROXY:-${https_proxy:-}}
        - NO_PROXY=${NO_PROXY:-${no_proxy:-localhost,127.0.0.1}}
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-${http_proxy:-}}
      - HTTPS_PROXY=${HTTPS_PROXY:-${https_proxy:-}}
      - NO_PROXY=${NO_PROXY:-${no_proxy:-localhost,127.0.0.1}}
      - http_proxy=${HTTP_PROXY:-${http_proxy:-}}
      - https_proxy=${HTTPS_PROXY:-${https_proxy:-}}
      - no_proxy=${NO_PROXY:-${no_proxy:-localhost,127.0.0.1}}
    container_name: cpp-dev-container
    volumes:
      # ホストのworkspaceディレクトリをコンテナの/workspaceにマウント
      - ./workspace:/workspace
      # ccache のキャッシュを永続化
      - ccache-data:/var/cache/ccache
    # コンテナを起動し続けるための設定
    tty: true
    stdin_open: true

volumes:
  ccache-data:
